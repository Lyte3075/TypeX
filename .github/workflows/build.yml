name: TypeX Multi-Platform Build

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typex-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Build iOS IPA
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned iOS app
        run: |
          set -e
          xcodebuild             -project TypeX.xcodeproj             -scheme TypeXApp             -configuration Release             -sdk iphoneos             -derivedDataPath build/ios             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             clean build

      - name: Package IPA
        run: |
          set -e
          PRODUCTS_DIR="build/ios/Build/Products/Release-iphoneos"
          APP_PATH="$PRODUCTS_DIR/TypeX.app"

          echo "Built products:"
          find "$PRODUCTS_DIR" -maxdepth 2 -print

          if [ ! -d "$APP_PATH" ]; then
            APP_PATH="$(find "$PRODUCTS_DIR" -maxdepth 1 -type d -name "*.app" -print -quit)"
          fi

          test -n "$APP_PATH"
          test -d "$APP_PATH"

          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/TypeX.app

          cd build/ipa
          /usr/bin/zip -qry ../TypeX-iOS-unsigned.ipa Payload
          test -f ../TypeX-iOS-unsigned.ipa

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: TypeX-iOS-unsigned-ipa
          path: build/TypeX-iOS-unsigned.ipa
          retention-days: 7

  android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build Android debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: TypeX-Android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
