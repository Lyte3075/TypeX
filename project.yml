name: TypeX

options:
  bundleIdPrefix: com.typex
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  TypeXApp:
    type: application
    platform: iOS
    sources:
      - TypeXApp
      - Shared
    dependencies:
      - target: TypeXKeyboard
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.typex.app
      INFOPLIST_FILE: TypeXApp/Info.plist
    info:
      path: TypeXApp/Info.plist
      properties:
        CFBundleDisplayName: TypeX
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true

  TypeXKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - TypeXKeyboard
      - Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.typex.app.keyboard
      INFOPLIST_FILE: TypeXKeyboard/Info.plist
    info:
      path: TypeXKeyboard/Info.plist
      properties:
        CFBundleDisplayName: TypeX Keyboard
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
